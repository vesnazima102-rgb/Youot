<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#faf4e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Мой планер" />
  <title>План на неделю</title>

  <!-- Встроенный PWA-манифест с иконкой приложения -->
  <link rel="manifest" id="pwaManifest" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23faf4e8'/%3E%3Ccircle cx='50' cy='52' r='32' fill='%23231f20'/%3E%3Cpath d='M16,44 L26,48 M18,62 L28,58 M34,20 L40,29 M64,20 L58,29 M84,44 L74,48 M82,62 L72,58 M38,84 L42,74 M62,84 L58,74' stroke='%23231f20' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='48' r='9' fill='%23fff'/%3E%3Ccircle cx='60' cy='48' r='9' fill='%23fff'/%3E%3Ccircle cx='41' cy='48' r='4' fill='%23111'/%3E%3Ccircle cx='59' cy='48' r='4' fill='%23111'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-paper: #f6efe2;
      --paper-card: #fffdf8;
      --tape-color: rgba(226, 206, 174, 0.82);
      --ink-main: #4a3f35;
      --ink-muted: #8c7b6b;
      --grid-line: #e6decf;
      --accent-warm: #e67e22;
      --shadow-soft: 0 3px 8px rgba(74, 63, 53, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Comfortaa', sans-serif;
      color: var(--ink-main);
      background-color: var(--bg-paper);
      background-image: 
        radial-gradient(#d8ccb8 1px, transparent 1px),
        radial-gradient(#e5d8c5 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      background-position: 0 0, 11px 11px;
    }

    .planner-book {
      width: 100%;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      padding: 10px 6px 6px;
      background: #faf4e8;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
      overflow: hidden;
    }

    .spiral-rings {
      position: absolute;
      top: -6px;
      left: 10px;
      right: 10px;
      height: 12px;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
      z-index: 5;
    }

    .ring {
      width: 6px;
      height: 13px;
      background: linear-gradient(90deg, #5c534a, #9e948a, #4a423b);
      border-radius: 4px;
    }

    /* Шапка */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      flex-shrink: 0;
      padding-top: 2px;
      width: 100%;
    }

    .main-title {
      margin: 0;
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      line-height: 1;
      color: #3d332a;
      background: var(--paper-card);
      padding: 4px 7px;
      border-radius: 8px;
      border: 1px dashed #cbbba0;
      transform: rotate(-1deg);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .notif-perm-btn {
      background: #fff3e0;
      border: 1px solid #f0c28b;
      color: #b85d19;
      padding: 4px 6px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.58rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .notif-perm-btn.granted {
      background: #eaf4e6;
      border-color: #b7d6ad;
      color: #4f7a42;
    }

    .week-nav {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--paper-card);
      padding: 2px 5px;
      border-radius: 12px;
      border: 1px solid #dfd3be;
      font-size: 0.58rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-btn {
      background: #efe5d4;
      border: none;
      color: var(--ink-main);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }

    /* Цитата недели */
    .quote-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--paper-card);
      border-radius: 8px;
      padding: 4px 8px;
      border: 1px solid #e5dac7;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
      width: 100%;
    }

    .quote-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .quote-label {
      font-size: 0.58rem;
      font-weight: 700;
      color: #786652;
    }

    .quote-input {
      width: 100%;
      min-width: 0;
      border: none;
      background: transparent;
      font-family: 'Caveat', cursive;
      font-size: 1.08rem;
      line-height: 1.1;
      color: var(--ink-main);
      outline: none;
      padding: 0;
      border-bottom: 1px dashed #dfd4c0;
    }

    /* Сетка 2x4 */
    .days-grid {
      flex: 1;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 5px;
      min-height: 0;
    }

    .day-card {
      background: var(--paper-card);
      border-radius: 8px;
      padding: 5px 5px 4px;
      box-shadow: var(--shadow-soft);
      border: 1px solid #e6dbc8;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .day-card.today {
      border: 1.5px solid #e67e22;
      background: #fffcf5;
    }

    .tape {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg);
      width: 28px;
      height: 8px;
      background: var(--tape-color);
      pointer-events: none;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 3px;
      background: #f2e8d5;
      padding: 2px 5px;
      border-radius: 5px;
      margin-bottom: 3px;
      flex-shrink: 0;
      min-width: 0;
    }

    .day-name {
      font-weight: 700;
      font-size: 0.66rem;
      color: #42362b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .day-date {
      font-size: 0.56rem;
      font-weight: 700;
      color: var(--ink-muted);
      background: #fffdf8;
      padding: 1px 4px;
      border-radius: 6px;
      border: 1px solid #e3d6c1;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .day-card.today .day-date {
      background: #e67e22;
      color: #fff;
      border-color: #e67e22;
    }

    .lines-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      background-image: 
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 13px 13px;
      border: 1px solid var(--grid-line);
      border-radius: 5px;
      padding: 1px 3px;
      overflow-y: auto;
      overflow-x: hidden;
      min-width: 0;
      min-height: 0;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 3px;
      min-height: 18px;
      width: 100%;
      min-width: 0;
      border-bottom: 1px solid rgba(228, 220, 205, 0.65);
    }

    .task-row:last-child {
      border-bottom: none;
    }

    .task-check {
      appearance: none;
      width: 11px;
      height: 11px;
      border: 1.2px solid #b5a48b;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      margin: 0;
    }

    .task-check:checked {
      background: #8ab07d;
      border-color: #749968;
    }

    .task-check:checked::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 8px;
      top: -2px;
      left: 1px;
    }

    .task-input {
      flex: 1;
      width: 0;
      min-width: 0;
      border: none;
      background: transparent;
      font-family: 'Caveat', cursive;
      font-size: 1.02rem;
      line-height: 1;
      color: var(--ink-main);
      outline: none;
      padding: 0;
    }

    .task-input.done {
      text-decoration: line-through;
      color: #a39582;
    }

    .task-input::placeholder {
      color: rgba(184, 170, 150, 0.45);
      font-size: 0.85rem;
    }

    .alarm-badge {
      font-size: 0.54rem;
      font-weight: 700;
      padding: 1px 2px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: #b5a48b;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      line-height: 1;
    }

    .alarm-badge.active {
      background: #fff0db;
      border-color: #f0be7d;
      color: #c96214;
      padding: 1px 3px;
    }

    /* Тёплое окно выбора времени */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(66, 50, 35, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: linear-gradient(180deg, #fffdf8 0%, #fbf3e4 100%);
      border: 2px solid #e2c8a3;
      border-radius: 20px;
      padding: 16px 14px;
      width: 100%;
      max-width: 310px;
      box-shadow: 0 14px 30px rgba(74, 52, 28, 0.25);
      text-align: center;
      position: relative;
    }

    .modal-tape {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 56px;
      height: 14px;
      background: rgba(244, 194, 134, 0.85);
      border-radius: 2px;
    }

    .modal-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: #5c432b;
      margin-bottom: 2px;
    }

    .modal-task-preview {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: #e67e22;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .picker-wheels {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #f5ead6;
      border: 1.5px solid #e3cfa9;
      border-radius: 14px;
      padding: 10px 8px;
      margin-bottom: 10px;
    }

    .wheel-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .wheel-label {
      font-size: 0.62rem;
      font-weight: 700;
      color: #8c7355;
      text-transform: uppercase;
    }

    .wheel-select {
      appearance: none;
      -webkit-appearance: none;
      background: #fffdf8;
      border: 2px solid #f0b878;
      border-radius: 12px;
      padding: 6px 12px;
      font-family: 'Comfortaa', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #4a3520;
      text-align: center;
      cursor: pointer;
      outline: none;
      box-shadow: 0 3px 0 #e5c39b;
    }

    .wheel-colon {
      font-size: 1.6rem;
      font-weight: 700;
      color: #e67e22;
      margin-top: 14px;
    }

    .quick-presets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin-bottom: 14px;
    }

    .preset-chip {
      background: #fff8eb;
      border: 1px solid #e6c59c;
      color: #8a5a2b;
      border-radius: 999px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 0.64rem;
      font-weight: 700;
      cursor: pointer;
    }

    .preset-chip:active {
      background: #e67e22;
      color: #fff;
      border-color: #e67e22;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .modal-btn {
      padding: 8px 14px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save {
      background: linear-gradient(180deg, #ff9436 0%, #e67e22 100%);
      color: #fff;
      box-shadow: 0 3px 0 #b85d14;
    }

    .btn-remove {
      background: #f3e7d5;
      color: #7d6b5d;
      border: 1px solid #d5c5ae;
    }

    /* Всплывающее уведомление сверху */
    .top-banner {
      position: fixed;
      top: -90px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 400px;
      background: #fffdf8;
      border: 2px solid #e67e22;
      border-radius: 14px;
      padding: 9px 12px;
      box-shadow: 0 10px 25px rgba(60, 45, 30, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 200;
      transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-banner.show {
      top: 10px;
    }

    .banner-text {
      flex: 1;
      text-align: left;
      min-width: 0;
    }

    .banner-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: #e67e22;
    }

    .banner-body {
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      color: var(--ink-main);
      line-height: 1.1;
    }

    /* Нижняя панель */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 3px 7px;
      background: var(--paper-card);
      border-radius: 8px;
      border: 1px dashed #cbbba0;
      font-size: 0.58rem;
      color: var(--ink-muted);
      flex-shrink: 0;
      width: 100%;
    }

    .calcifer-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .calcifer-badge span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flame-anim {
      animation: flicker 1.8s infinite alternate ease-in-out;
      transform-origin: bottom center;
      flex-shrink: 0;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(3deg); }
    }

    .clear-btn {
      background: #f5ebe0;
      border: 1px solid #d5c5ae;
      color: #6e5d4f;
      padding: 2px 6px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.58rem;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Всплывающая шторка уведомления -->
  <div class="top-banner" id="topBanner">
    <div style="font-size: 1.4rem;">🔥</div>
    <div class="banner-text">
      <div class="banner-title" id="bannerTitle">Напоминание из планера!</div>
      <div class="banner-body" id="bannerBody">Пора выполнить задачу</div>
    </div>
    <button class="modal-btn btn-save" onclick="closeBanner()">Ок</button>
  </div>

  <!-- Тёплое окно выбора времени -->
  <div class="modal-overlay" id="alarmModal">
    <div class="modal-card">
      <div class="modal-tape"></div>
      <div class="modal-title">✨ Когда напомнить?</div>
      <div class="modal-task-preview" id="modalTaskName">...</div>

      <div class="picker-wheels">
        <div class="wheel-col">
          <span class="wheel-label">Часы</span>
          <select id="hourSelect" class="wheel-select"></select>
        </div>
        <span class="wheel-colon">:</span>
        <div class="wheel-col">
          <span class="wheel-label">Минуты</span>
          <select id="minuteSelect" class="wheel-select"></select>
        </div>
      </div>

      <div class="quick-presets">
        <button type="button" class="preset-chip" data-add="15">+15 мин</button>
        <button type="button" class="preset-chip" data-add="30">+30 мин</button>
        <button type="button" class="preset-chip" data-add="60">+1 час</button>
        <button type="button" class="preset-chip" data-add="120">+2 часа</button>
      </div>

      <div class="modal-actions">
        <button class="modal-btn btn-remove" id="removeAlarmBtn">Убрать</button>
        <button class="modal-btn btn-save" id="saveAlarmBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="planner-book">
    <div class="spiral-rings" id="spiralRings"></div>

    <!-- Шапка -->
    <div class="header-row">
      <h1 class="main-title">План на неделю</h1>
      <div class="header-controls">
        <button class="notif-perm-btn" id="permBtn">🔔 Звук</button>
        <div class="week-nav">
          <button class="nav-btn" id="prevWeek">◀</button>
          <span id="weekRangeLabel">...</span>
          <button class="nav-btn" id="nextWeek">▶</button>
        </div>
      </div>
    </div>

    <!-- Цитата недели -->
    <div class="quote-bar">
      <div class="quote-content">
        <span class="quote-label">✨ Цитата недели:</span>
        <input 
          type="text" 
          id="quoteInput" 
          class="quote-input" 
          placeholder="Нажми, чтобы вписать цитату..." />
      </div>

      <svg width="34" height="28" viewBox="0 0 100 85" style="flex-shrink:0; cursor:pointer;" onclick="playMagicChime()">
        <g transform="translate(30, 45)">
          <circle cx="0" cy="0" r="22" fill="#231f20" />
          <path d="M-24,-6 L-18,-2 M-22,8 L-16,4 M-12,-22 L-8,-16 M8,-22 L6,-16 M22,-8 L16,-4 M20,10 L14,6 M-8,22 L-5,16 M10,21 L7,15" stroke="#231f20" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-7" cy="-3" r="6" fill="#fff"/>
          <circle cx="7" cy="-3" r="6" fill="#fff"/>
          <circle cx="-6" cy="-3" r="2.5" fill="#111"/>
          <circle cx="6" cy="-3" r="2.5" fill="#111"/>
        </g>
        <g transform="translate(72, 34)">
          <circle cx="0" cy="0" r="16" fill="#231f20" />
          <path d="M-18,-4 L-13,-1 M-15,8 L-11,5 M-6,-18 L-4,-12 M8,-16 L6,-11 M17,-3 L12,-1 M14,9 L10,6" stroke="#231f20" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="-5" cy="-2" r="4.5" fill="#fff"/>
          <circle cx="5" cy="-2" r="4.5" fill="#fff"/>
          <circle cx="-4" cy="-2" r="2" fill="#111"/>
          <circle cx="4" cy="-2" r="2" fill="#111"/>
        </g>
      </svg>
    </div>

    <!-- Сетка 2x4 -->
    <div class="days-grid" id="daysGrid"></div>

    <!-- Нижняя панель -->
    <div class="footer-bar">
      <div class="calcifer-badge">
        <svg class="flame-anim" width="14" height="16" viewBox="0 0 60 70">
          <path d="M30 5 C35 20, 52 28, 48 48 C45 60, 15 60, 12 48 C8 30, 22 22, 30 5 Z" fill="#ff7b25"/>
          <path d="M30 18 C34 28, 43 34, 40 47 C38 55, 22 55, 20 47 C17 35, 25 28, 30 18 Z" fill="#ffd15c"/>
          <circle cx="24" cy="41" r="4" fill="#fff"/>
          <circle cx="36" cy="41" r="4" fill="#fff"/>
          <circle cx="24" cy="41" r="2" fill="#222"/>
          <circle cx="36" cy="41" r="2" fill="#222"/>
        </svg>
        <span id="saveStatus">Нажми 🔔 у дела, чтобы задать время</span>
      </div>
      <button class="clear-btn" id="clearWeekBtn">Очистить</button>
    </div>
  </div>

  <script>
    // 1. Динамический PWA-манифест (позволяет установить сайт как приложение)
    const iconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23faf4e8'/><circle cx='256' cy='266' r='160' fill='%23231f20'/><path d='M80,220 L130,240 M90,310 L140,290 M170,100 L200,145 M330,100 L300,145 M430,220 L380,240 M420,310 L370,290 M190,425 L210,375 M320,425 L300,375' stroke='%23231f20' stroke-width='24' stroke-linecap='round'/><circle cx='205' cy='246' r='44' fill='%23fff'/><circle cx='307' cy='246' r='44' fill='%23fff'/><circle cx='210' cy='246' r='20' fill='%23111'/><circle cx='302' cy='246' r='20' fill='%23111'/></svg>`;
    const manifestObj = {
      name: 'Мой план на неделю',
      short_name: 'Планер',
      start_url: './index.html',
      display: 'standalone',
      background_color: '#faf4e8',
      theme_color: '#faf4e8',
      icons: [
        {
          src: `data:image/svg+xml,${iconSvg}`,
          sizes: '512x512',
          type: 'image/svg+xml',
          purpose: 'any maskable'
        }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
    document.getElementById('pwaManifest').href = URL.createObjectURL(manifestBlob);

    // 2. Регистрация Service Worker
    let swRegistration = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => { swRegistration = reg; })
        .catch(() => {});
    }

    const DAYS_OF_WEEK = [
      'Понедельник', 'Вторник', 'Среда', 'Четверг',
      'Пятница', 'Суббота', 'Воскресенье', 'Заметки'
    ];

    const MONTHS_SHORT = [
      'янв', 'фев', 'мар', 'апр', 'мая', 'июн',
      'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'
    ];

    const ROWS_PER_DAY = 4;
    let weekOffset = 0;
    let activeAlarmContext = null;

    const hourSelect = document.getElementById('hourSelect');
    const minuteSelect = document.getElementById('minuteSelect');

    for (let h = 0; h < 24; h++) {
      const hh = String(h).padStart(2, '0');
      const opt = document.createElement('option');
      opt.value = hh;
      opt.textContent = hh;
      hourSelect.appendChild(opt);
    }

    for (let m = 0; m < 60; m++) {
      const mm = String(m).padStart(2, '0');
      const opt = document.createElement('option');
      opt.value = mm;
      opt.textContent = mm;
      minuteSelect.appendChild(opt);
    }

    document.querySelectorAll('.preset-chip').forEach((btn) => {
      btn.onclick = () => {
        const addMins = Number(btn.dataset.add);
        const base = new Date();
        base.setMinutes(base.getMinutes() + addMins);
        hourSelect.value = String(base.getHours()).padStart(2, '0');
        minuteSelect.value = String(base.getMinutes()).padStart(2, '0');
      };
    });

    const spiralContainer = document.getElementById('spiralRings');
    for (let i = 0; i < 16; i++) {
      const ring = document.createElement('div');
      ring.className = 'ring';
      spiralContainer.appendChild(ring);
    }

    let audioCtx = null;
    function playMagicChime() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const notes = [659.25, 830.61, 987.77, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.14);

          gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + idx * 0.14 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.14 + 0.75);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + idx * 0.14);
          osc.stop(audioCtx.currentTime + idx * 0.14 + 0.8);
        });
      } catch (e) {}
    }

    const permBtn = document.getElementById('permBtn');
    function updatePermButton() {
      if ('Notification' in window && Notification.permission === 'granted') {
        permBtn.textContent = '🔔 Вкл';
        permBtn.classList.add('granted');
      }
    }
    updatePermButton();

    permBtn.onclick = async () => {
      playMagicChime();
      if ('Notification' in window) {
        const res = await Notification.requestPermission();
        updatePermButton();
        if (res === 'granted') {
          showNotificationBanner('Уведомления включены!', 'Теперь планер пришлёт напоминание в шторку ✨', true);
        } else {
          showNotificationBanner('Звук включён!', 'Всплывающие напоминания внутри планера готовы ✨', false);
        }
      } else {
        showNotificationBanner('Звук включён!', 'Напоминания сработают со звуком внутри страницы ✨', false);
      }
    };

    async function showNotificationBanner(title, text, sendSystemPush = true) {
      playMagicChime();
      const banner = document.getElementById('topBanner');
      document.getElementById('bannerTitle').textContent = title;
      document.getElementById('bannerBody').textContent = text;
      banner.classList.add('show');

      clearTimeout(window._bannerTimer);
      window._bannerTimer = setTimeout(() => {
        banner.classList.remove('show');
      }, 8000);

      if (sendSystemPush && 'Notification' in window && Notification.permission === 'granted') {
        const options = {
          body: text,
          vibrate: [200, 100, 200],
          tag: 'ghibli-planner-reminder',
          renotify: true
        };
        try {
          if (swRegistration && swRegistration.showNotification) {
            await swRegistration.showNotification(title, options);
          } else {
            new Notification(title, options);
          }
        } catch (e) {}
      }
    }

    function closeBanner() {
      document.getElementById('topBanner').classList.remove('show');
    }

    function getMondayOfWeek(offset) {
      const now = new Date();
      const day = now.getDay();
      const diff = (day === 0 ? -6 : 1) - day + offset * 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diff);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function getWeekKey(mondayDate) {
      const y = mondayDate.getFullYear();
      const m = String(mondayDate.getMonth() + 1).padStart(2, '0');
      const d = String(mondayDate.getDate()).padStart(2, '0');
      return `ghibli_planner_${y}-${m}-${d}`;
    }

    function loadWeekData(weekKey) {
      try {
        const raw = localStorage.getItem(weekKey);
        return raw ? JSON.parse(raw) : { quote: '', days: {} };
      } catch (e) {
        return { quote: '', days: {} };
      }
    }

    function saveWeekData(weekKey, data) {
      localStorage.setItem(weekKey, JSON.stringify(data));
      const status = document.getElementById('saveStatus');
      status.textContent = 'Сохранено ✓';
      clearTimeout(window._saveTimer);
      window._saveTimer = setTimeout(() => {
        status.textContent = 'Нажми 🔔 у дела, чтобы задать время';
      }, 1500);
    }

    const modal = document.getElementById('alarmModal');

    function openAlarmModal(weekKey, dayIdx, rowIdx, taskText, currentTime) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      activeAlarmContext = { weekKey, dayIdx, rowIdx };
      document.getElementById('modalTaskName').textContent = taskText || 'Задача без названия';

      if (currentTime && currentTime.includes(':')) {
        const [hh, mm] = currentTime.split(':');
        hourSelect.value = hh;
        minuteSelect.value = mm;
      } else {
        const now = new Date();
        now.setMinutes(now.getMinutes() + 15);
        hourSelect.value = String(now.getHours()).padStart(2, '0');
        minuteSelect.value = String(now.getMinutes()).padStart(2, '0');
      }
      modal.classList.add('open');
    }

    document.getElementById('saveAlarmBtn').onclick = () => {
      if (!activeAlarmContext) return;
      const { weekKey, dayIdx, rowIdx } = activeAlarmContext;
      const data = loadWeekData(weekKey);
      if (data.days[dayIdx] && data.days[dayIdx][rowIdx]) {
        data.days[dayIdx][rowIdx].time = `${hourSelect.value}:${minuteSelect.value}`;
        data.days[dayIdx][rowIdx].notified = false;
        saveWeekData(weekKey, data);
      }
      modal.classList.remove('open');
      renderPlanner();
    };

    document.getElementById('removeAlarmBtn').onclick = () => {
      if (!activeAlarmContext) return;
      const { weekKey, dayIdx, rowIdx } = activeAlarmContext;
      const data = loadWeekData(weekKey);
      if (data.days[dayIdx] && data.days[dayIdx][rowIdx]) {
        delete data.days[dayIdx][rowIdx].time;
        delete data.days[dayIdx][rowIdx].notified;
        saveWeekData(weekKey, data);
      }
      modal.classList.remove('open');
      renderPlanner();
    };

    modal.onclick = (e) => {
      if (e.target === modal) modal.classList.remove('open');
    };

    function renderPlanner() {
      const monday = getMondayOfWeek(weekOffset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const weekKey = getWeekKey(monday);
      const data = loadWeekData(weekKey);

      const rangeText = `${monday.getDate()} ${MONTHS_SHORT[monday.getMonth()]} — ${sunday.getDate()} ${MONTHS_SHORT[sunday.getMonth()]}`;
      document.getElementById('weekRangeLabel').textContent = rangeText;

      const quoteInput = document.getElementById('quoteInput');
      quoteInput.value = data.quote || '';
      quoteInput.oninput = () => {
        data.quote = quoteInput.value;
        saveWeekData(weekKey, data);
      };

      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      const todayStr = new Date().toDateString();

      DAYS_OF_WEEK.forEach((dayName, dayIdx) => {
        const card = document.createElement('div');
        card.className = 'day-card';

        let dateBadgeText = 'важное';
        if (dayIdx < 7) {
          const currentDate = new Date(monday);
          currentDate.setDate(monday.getDate() + dayIdx);
          dateBadgeText = `${currentDate.getDate()} ${MONTHS_SHORT[currentDate.getMonth()]}`;

          if (currentDate.toDateString() === todayStr) {
            card.classList.add('today');
          }
        }

        const tape = document.createElement('div');
        tape.className = 'tape';
        card.appendChild(tape);

        const header = document.createElement('div');
        header.className = 'day-header';
        header.innerHTML = `
          <span class="day-name">${dayName}</span>
          <span class="day-date">${dateBadgeText}</span>
        `;
        card.appendChild(header);

        const linesBox = document.createElement('div');
        linesBox.className = 'lines-container';

        if (!data.days[dayIdx]) {
          data.days[dayIdx] = Array.from({ length: ROWS_PER_DAY }, () => ({ text: '', done: false }));
        }

        for (let r = 0; r < ROWS_PER_DAY; r++) {
          const rowData = data.days[dayIdx][r] || { text: '', done: false };

          const row = document.createElement('div');
          row.className = 'task-row';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'task-check';
          checkbox.checked = rowData.done;

          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'task-input' + (rowData.done ? ' done' : '');
          input.value = rowData.text;
          input.placeholder = '...';

          const alarmBtn = document.createElement('button');
          alarmBtn.type = 'button';
          alarmBtn.className = 'alarm-badge' + (rowData.time ? ' active' : '');
          alarmBtn.textContent = rowData.time ? rowData.time : '🔔';
          alarmBtn.title = 'Настроить время напоминания';

          alarmBtn.onclick = () => {
            openAlarmModal(weekKey, dayIdx, r, input.value, rowData.time);
          };

          checkbox.onchange = () => {
            data.days[dayIdx][r].done = checkbox.checked;
            input.classList.toggle('done', checkbox.checked);
            saveWeekData(weekKey, data);
          };

          input.oninput = () => {
            data.days[dayIdx][r].text = input.value;
            saveWeekData(weekKey, data);
          };

          input.onkeydown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              const nextRow = row.nextElementSibling;
              if (nextRow) {
                nextRow.querySelector('.task-input').focus();
              }
            }
          };

          row.appendChild(checkbox);
          row.appendChild(input);
          row.appendChild(alarmBtn);
          linesBox.appendChild(row);
        }

        card.appendChild(linesBox);
        grid.appendChild(card);
      });
    }

    function checkScheduledReminders() {
      const now = new Date();
      const currentHHMM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const currentMonday = getMondayOfWeek(0);
      const currentWeekKey = getWeekKey(currentMonday);
      const data = loadWeekData(currentWeekKey);

      const jsDay = now.getDay();
      const todayIdx = jsDay === 0 ? 6 : jsDay - 1;

      let changed = false;

      [todayIdx, 7].forEach((dIdx) => {
        const tasks = data.days[dIdx];
        if (!tasks) return;

        tasks.forEach((task) => {
          if (task.time === currentHHMM && !task.done && !task.notified) {
            task.notified = true;
            changed = true;
            const title = `🔥 План на ${DAYS_OF_WEEK[dIdx].toLowerCase()} (${task.time})`;
            const body = task.text.trim() || 'Время выполнить запланированное дело!';
            showNotificationBanner(title, body, true);
          }
        });
      });

      if (changed) {
        saveWeekData(currentWeekKey, data);
      }
    }

    setInterval(checkScheduledReminders, 5000);

    document.getElementById('prevWeek').onclick = () => {
      weekOffset--;
      renderPlanner();
    };

    document.getElementById('nextWeek').onclick = () => {
      weekOffset++;
      renderPlanner();
    };

    document.getElementById('clearWeekBtn').onclick = () => {
      if (confirm('Очистить записи за эту неделю?')) {
        const weekKey = getWeekKey(getMondayOfWeek(weekOffset));
        localStorage.removeItem(weekKey);
        renderPlanner();
      }
    };

    renderPlanner();
  </script>
</body>
</html>
